          # Verify installation
          oasis --version
          oasis --health-check
          \`\`\`

          ## 📋 What's New in v$VERSION

          $(git log --pretty=format:"- %s" --no-merges \$(git describe --tags --abbrev=0)..HEAD | head -10)

