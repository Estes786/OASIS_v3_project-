name: 📱 Termux Orchestrator Distribution Pipeline
on:
  push:
    branches: [main, develop]
    paths:
      - 'termux/**'
      - '.github/workflows/termux-release-automation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'termux/**'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      force_release:
        description: 'Force release (skip tests)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  OASIS_VERSION: ${{ github.sha }}
  TERMUX_MAX_SIZE_MB: 5
  MIN_ANDROID_API: 21
  MAX_ANDROID_API: 34

jobs:
  # Validate ultra-lightweight constraints
  validate-constraints:
    name: 🔍 Validate Ultra-Lightweight Constraints
    runs-on: ubuntu-latest
    outputs:
      size-compliant: ${{ steps.size-check.outputs.compliant }}
      dependency-count: ${{ steps.deps-check.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate OASIS Termux structure
        run: |
          cd termux

          echo "🔍 Validating OASIS Termux orchestrator structure..."

          python3 -c "
          import os, sys, json

          # Check required OASIS Termux files
          required_files = [
              'oasis_orchestrator.py',
              'requirements.txt', 
              'setup.py',
              '.oasis_termux_config.json',
              'README.md',
              'install.sh'
          ]

          missing_files = [f for f in required_files if not os.path.exists(f)]
          if missing_files:
              print(f'❌ Missing required OASIS Termux files: {missing_files}')
              sys.exit(1)

          # Validate OASIS Termux configuration
          try:
              with open('.oasis_termux_config.json') as f:
                  config = json.load(f)

              required_keys = [
                  'orchestrator_version', 
                  'max_size_mb', 
                  'allowed_dependencies',
                  'hf_spaces_endpoints',
                  'api_timeout'
              ]

              missing_keys = [k for k in required_keys if k not in config]
              if missing_keys:
                  print(f'❌ Missing OASIS Termux config keys: {missing_keys}')
                  sys.exit(1)

              # Validate ultra-lightweight constraints
              max_size = config.get('max_size_mb', 999)
              if max_size > ${{ env.TERMUX_MAX_SIZE_MB }}:
                  print(f'❌ Size limit exceeded: {max_size}MB > ${{ env.TERMUX_MAX_SIZE_MB }}MB')
                  sys.exit(1)

              allowed_deps = config.get('allowed_dependencies', [])
              forbidden_deps = ['numpy', 'torch', 'tensorflow', 'pandas', 'scikit-learn', 'opencv-python']
              violations = [dep for dep in forbidden_deps if any(dep in allowed for allowed in allowed_deps)]

              if violations:
                  print(f'❌ Forbidden heavy dependencies detected: {violations}')
                  sys.exit(1)

              print(f'✅ OASIS Termux configuration validated')
              print(f'📦 Size limit: {max_size}MB (OASIS Ultra-Lightweight: <${{ env.TERMUX_MAX_SIZE_MB }}MB)')
              print(f'🔗 HF Spaces endpoints: {len(config.get("hf_spaces_endpoints", []))}')
              print(f'⚡ API timeout: {config.get("api_timeout", "unknown")}')

          except Exception as e:
              print(f'❌ OASIS Termux config validation failed: {e}')
              sys.exit(1)
          "

      - name: Validate requirements.txt ultra-lightweight compliance
        id: deps-check
        run: |
          cd termux

          echo "🔍 Validating dependencies for ultra-lightweight compliance..."

          # Check requirements.txt exists and is minimal
          if [ ! -f "requirements.txt" ]; then
            echo "❌ requirements.txt not found"
            exit 1
          fi

          # Count dependencies
          DEPS_COUNT=$(grep -v '^#' requirements.txt | grep -v '^$' | wc -l)
          echo "📊 Total dependencies: $DEPS_COUNT"

          # OASIS ultra-lightweight: maximum 3 dependencies (urllib3, requests optional)
          if [ $DEPS_COUNT -gt 3 ]; then
            echo "❌ Too many dependencies for ultra-lightweight: $DEPS_COUNT > 3"
            echo "🔍 OASIS principle: Use only Python stdlib + urllib/requests"
            exit 1
          fi

          # Check for forbidden heavy dependencies
          FORBIDDEN_DEPS="numpy pandas torch tensorflow scikit-learn opencv-python matplotlib seaborn plotly"

          for dep in $FORBIDDEN_DEPS; do
            if grep -q "$dep" requirements.txt; then
              echo "❌ Forbidden heavy dependency detected: $dep"
              echo "🚫 OASIS ultra-lightweight principle violated"
              exit 1
            fi
          done

          # Validate allowed lightweight dependencies only
          ALLOWED_PATTERN="^(requests|urllib3|certifi).*$"

          while IFS= read -r line; do
            # Skip comments and empty lines
            if [[ $line =~ ^#.*$ ]] || [[ -z "$line" ]]; then
              continue
            fi

            if ! [[ $line =~ $ALLOWED_PATTERN ]]; then
              echo "❌ Potentially heavy dependency: $line"
              echo "⚠️ Only requests, urllib3, certifi allowed for OASIS ultra-lightweight"
              # Allow but warn for now
            fi
          done < requirements.txt

          echo "count=$DEPS_COUNT" >> $GITHUB_OUTPUT
          echo "✅ Dependencies validated for ultra-lightweight compliance"

      - name: Calculate package size
        id: size-check
        run: |
          cd termux

          echo "📏 Calculating OASIS Termux orchestrator package size..."

          # Create temporary installation to measure size
          mkdir -p /tmp/oasis_size_test
          cp -r . /tmp/oasis_size_test/
          cd /tmp/oasis_size_test

          # Install dependencies to measure total footprint
          python3 -m pip install --target=./lib -r requirements.txt --quiet

          # Calculate total size
          TOTAL_SIZE=$(du -sb . | cut -f1)
          SIZE_MB=$((TOTAL_SIZE / 1024 / 1024))

          echo "📦 Total package size: ${SIZE_MB}MB"
          echo "🎯 OASIS limit: ${{ env.TERMUX_MAX_SIZE_MB }}MB"

          if [ $SIZE_MB -gt ${{ env.TERMUX_MAX_SIZE_MB }} ]; then
            echo "❌ Package exceeds ultra-lightweight limit: ${SIZE_MB}MB > ${{ env.TERMUX_MAX_SIZE_MB }}MB"
            echo "🔍 Size breakdown:"
            du -sh * | sort -hr | head -10
            echo "compliant=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ Package within ultra-lightweight limit: ${SIZE_MB}MB <= ${{ env.TERMUX_MAX_SIZE_MB }}MB"
            echo "compliant=true" >> $GITHUB_OUTPUT
          fi

          # Detailed size analysis
          echo "📊 Detailed size breakdown:"
          du -sh * | sort -hr

          # Check for specific file size violations
          find . -type f -size +500k -exec ls -lh {} \; | head -5

          echo "🎉 OASIS ultra-lightweight validation completed"

  # Test Termux orchestrator functionality
  test-orchestrator:
    name: 🧪 Test Termux Orchestrator
    runs-on: ubuntu-latest
    needs: validate-constraints
    if: needs.validate-constraints.outputs.size-compliant == 'true' && !inputs.force_release
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Termux orchestrator
        run: |
          cd termux

          echo "🔧 Installing OASIS Termux orchestrator..."

          # Install in isolated environment
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          # Install orchestrator
          python setup.py develop

          echo "✅ Installation completed"

      - name: Test orchestrator core functionality  
        run: |
          cd termux

          echo "🧪 Testing OASIS orchestrator core functionality..."

          python -c "
          import sys
          sys.path.insert(0, '.')

          try:
              import oasis_orchestrator
              print('✅ Orchestrator imports successfully')

              # Test initialization
              orchestrator = oasis_orchestrator.OasisOrchestrator()
              print('✅ Orchestrator initializes successfully')

              # Test configuration loading
              config = orchestrator.load_config()
              print(f'✅ Configuration loaded: {len(config)} parameters')

              # Test HF Spaces endpoint validation
              endpoints = orchestrator.get_hf_endpoints()
              print(f'✅ HF Spaces endpoints: {len(endpoints)} configured')

              # Test ultra-lightweight API client
              api_client = orchestrator.get_api_client()
              print('✅ Ultra-lightweight API client initialized')

              # Test memory footprint
              import psutil, os
              process = psutil.Process(os.getpid())
              memory_mb = process.memory_info().rss / 1024 / 1024
              print(f'📊 Memory footprint: {memory_mb:.2f}MB')

              if memory_mb > 50:  # 50MB limit for orchestrator + Python
                  print(f'⚠️ High memory usage: {memory_mb:.2f}MB')
              else:
                  print('✅ Memory usage within limits')

          except ImportError as e:
              print(f'❌ Import failed: {e}')
              sys.exit(1)
          except Exception as e:
              print(f'❌ Test failed: {e}')
              sys.exit(1)
          "

      - name: Test API communication
        run: |
          cd termux

          echo "🌐 Testing API communication capabilities..."

          python -c "
          import sys
          sys.path.insert(0, '.')
          import oasis_orchestrator
          import time

          orchestrator = oasis_orchestrator.OasisOrchestrator()

          # Test URL validation
          test_urls = [
              'https://httpbin.org/status/200',
              'https://httpbin.org/json',
              'https://httpbin.org/delay/1'
          ]

          for url in test_urls:
              try:
                  start_time = time.time()
                  response = orchestrator.make_request(url, timeout=10)
                  duration = time.time() - start_time

                  if response and response.get('status_code') in [200, None]:
                      print(f'✅ {url}: OK ({duration:.2f}s)')
                  else:
                      print(f'⚠️ {url}: Unexpected response')
              except Exception as e:
                  print(f'⚠️ {url}: {e}')

          # Test timeout handling
          try:
              start_time = time.time()
              response = orchestrator.make_request('https://httpbin.org/delay/15', timeout=3)
              duration = time.time() - start_time
              print(f'⚠️ Timeout test failed: completed in {duration:.2f}s')
          except Exception as e:
              duration = time.time() - start_time
              if duration < 5:  # Should timeout within 5s
                  print(f'✅ Timeout handling works: {duration:.2f}s')
              else:
                  print(f'⚠️ Timeout handling slow: {duration:.2f}s')

          print('✅ API communication tests completed')
          "

      - name: Test HuggingFace Spaces integration
        run: |
          cd termux

          echo "☁️ Testing HuggingFace Spaces integration..."

          python -c "
          import sys
          sys.path.insert(0, '.')
          import oasis_orchestrator

          orchestrator = oasis_orchestrator.OasisOrchestrator()

          # Test HF API endpoint construction
          try:
              hf_client = orchestrator.get_hf_client()
              print('✅ HF Spaces client initialized')

              # Test endpoint validation
              endpoints = orchestrator.validate_hf_endpoints()
              print(f'✅ HF endpoints validated: {len(endpoints)} available')

              # Test request formatting for HF Spaces
              test_request = orchestrator.format_hf_request('test_space', {'input': 'test'})
              if test_request and 'url' in test_request:
                  print('✅ HF request formatting works')
              else:
                  print('⚠️ HF request formatting issues')

          except Exception as e:
              print(f'⚠️ HF integration test failed: {e}')

          print('✅ HF Spaces integration tests completed')
          "

  # Android compatibility testing
  android-compatibility:
    name: 🤖 Android Compatibility Testing
    runs-on: ubuntu-latest
    needs: validate-constraints
    if: needs.validate-constraints.outputs.size-compliant == 'true'
    strategy:
      matrix:
        android-api: [21, 24, 28, 30, 33, 34]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android emulation environment
        run: |
          echo "🤖 Setting up Android API ${{ matrix.android-api }} compatibility test..."

          # Install Android SDK components (minimal for testing)
          sudo apt-get update
          sudo apt-get install -y android-tools-adb android-tools-fastboot

          echo "📱 Android tools installed for API ${{ matrix.android-api }} testing"

      - name: Test Python compatibility for Android API ${{ matrix.android-api }}
        run: |
          cd termux

          echo "🐍 Testing Python compatibility for Android API ${{ matrix.android-api }}..."

          python3 -c "
          import sys
          import subprocess
          import json

          # Load OASIS Termux configuration
          with open('.oasis_termux_config.json') as f:
              config = json.load(f)

          api_level = ${{ matrix.android-api }}
          min_api = config.get('min_android_api', ${{ env.MIN_ANDROID_API }})
          max_api = config.get('max_android_api', ${{ env.MAX_ANDROID_API }})

          print(f'📱 Testing Android API {api_level}')
          print(f'🎯 Supported range: API {min_api}-{max_api}')

          if api_level < min_api:
              print(f'⚠️ API {api_level} below minimum supported ({min_api})')
              print('🔧 Consider updating min_android_api or adding compatibility layer')
          elif api_level > max_api:
              print(f'⚠️ API {api_level} above maximum tested ({max_api})')
              print('🔧 Consider testing and updating max_android_api')
          else:
              print(f'✅ API {api_level} within supported range')

          # Test imports that would run on Android
          try:
              import urllib.request
              import urllib.parse
              import json
              import os
              import sys
              import time
              import threading
              print('✅ Core libraries compatible with Android')
          except Exception as e:
              print(f'❌ Compatibility issue: {e}')
              sys.exit(1)

          # Test file operations that Termux would use
          try:
              import tempfile
              with tempfile.NamedTemporaryFile(mode='w', delete=False) as f:
                  f.write('test')
                  temp_path = f.name

              with open(temp_path, 'r') as f:
                  content = f.read()

              os.unlink(temp_path)
              print('✅ File operations compatible')
          except Exception as e:
              print(f'❌ File operation issue: {e}')
              sys.exit(1)

          print(f'🎉 Android API {api_level} compatibility verified')
          "

      - name: Test Termux-specific features for API ${{ matrix.android-api }}
        run: |
          cd termux

          echo "📱 Testing Termux-specific features for API ${{ matrix.android-api }}..."

          python3 -c "
          import sys
          sys.path.insert(0, '.')

          # Simulate Termux environment variables
          import os
          os.environ['TERMUX_VERSION'] = '0.118'
          os.environ['ANDROID_ROOT'] = '/system' 
          os.environ['ANDROID_DATA'] = '/data'

          try:
              import oasis_orchestrator

              # Test Termux-specific initialization
              orchestrator = oasis_orchestrator.OasisOrchestrator()

              # Test Termux environment detection
              is_termux = orchestrator.detect_termux_environment()
              print(f'📱 Termux environment detected: {is_termux}')

              # Test Termux-specific paths
              termux_paths = orchestrator.get_termux_paths()
              print(f'📂 Termux paths configured: {len(termux_paths)}')

              # Test Android permissions simulation
              permissions = orchestrator.check_android_permissions()
              print(f'🔐 Android permissions: {permissions}')

              # Test storage access patterns
              storage_test = orchestrator.test_storage_access()
              print(f'💾 Storage access: {"✅" if storage_test else "⚠️"} {"OK" if storage_test else "Limited"}')

              print(f'✅ Termux features compatible with Android API ${{ matrix.android-api }}')

          except Exception as e:
              print(f'❌ Termux feature test failed: {e}')
              sys.exit(1)
          "

  # Security and permissions testing
  security-scan:
    name: 🔒 Security & Permissions Scan  
    runs-on: ubuntu-latest
    needs: validate-constraints
    if: needs.validate-constraints.outputs.size-compliant == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit safety semgrep

      - name: Run Bandit security scan
        run: |
          cd termux

          echo "🔒 Running Bandit security scan on OASIS Termux orchestrator..."

          bandit -r . -f json -o bandit-report.json -ll || true
          bandit -r . -ll || echo "⚠️ Security issues detected in Termux orchestrator"

          # Check for specific Android/Termux security concerns
          echo "🤖 Checking Android-specific security patterns..."

          grep -r "subprocess\|eval\|exec\|os\.system" . && echo "⚠️ Potentially unsafe system calls found" || echo "✅ No unsafe system calls detected"
          grep -r "pickle\|marshal" . && echo "⚠️ Unsafe serialization detected" || echo "✅ No unsafe serialization"
          grep -r "input()" . && echo "⚠️ Raw input() usage detected" || echo "✅ No raw input() usage"

      - name: Check dependency vulnerabilities
        run: |
          cd termux

          echo "🔍 Checking dependencies for vulnerabilities..."

          safety check -r requirements.txt --json --output safety-report.json || true
          safety check -r requirements.txt || echo "⚠️ Vulnerable dependencies detected"

      - name: Validate Android permissions model
        run: |
          cd termux

          echo "🔐 Validating Android permissions model..."

          python3 -c "
          import sys, os, json
          sys.path.insert(0, '.')

          # Check if orchestrator properly handles Android security model
          try:
              import oasis_orchestrator

              orchestrator = oasis_orchestrator.OasisOrchestrator()

              # Test permission requests
              network_perm = orchestrator.check_network_permission()
              storage_perm = orchestrator.check_storage_permission()

              print(f'🌐 Network permission: {"✅" if network_perm else "❌"} {"Granted" if network_perm else "Required"}')
              print(f'💾 Storage permission: {"✅" if storage_perm else "❌"} {"Granted" if storage_perm else "Required"}')

              # Test security boundaries
              security_check = orchestrator.validate_security_boundaries()
              print(f'🔐 Security boundaries: {"✅" if security_check else "❌"} {"Valid" if security_check else "Issues detected"}')

              print('✅ Android permissions model validation completed')

          except Exception as e:
              print(f'❌ Permissions validation failed: {e}')
              sys.exit(1)
          "

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports-termux-${{ github.sha }}
          path: |
            termux/bandit-report.json
            termux/safety-report.json

  # Create release packages
  build-release:
    name: 📦 Build Release Packages
    runs-on: ubuntu-latest
    needs: [validate-constraints, test-orchestrator, android-compatibility, security-scan]
    if: |
      always() &&
      needs.validate-constraints.outputs.size-compliant == 'true' &&
      (needs.test-orchestrator.result == 'success' || needs.test-orchestrator.result == 'skipped') &&
      (needs.android-compatibility.result == 'success' || needs.android-compatibility.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    outputs:
      version: ${{ steps.version.outputs.version }}
      package-size: ${{ steps.package.outputs.size }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate version number
        id: version
        run: |
          cd termux

          # Read current version from config
          CURRENT_VERSION=$(python3 -c "
          import json
          with open('.oasis_termux_config.json') as f:
              config = json.load(f)
          print(config.get('orchestrator_version', '1.0.0'))
          ")

          echo "📊 Current version: $CURRENT_VERSION"

          # Generate new version based on input or commit
          if [ "${{ inputs.release_type }}" != "" ]; then
            RELEASE_TYPE="${{ inputs.release_type }}"
          else
            # Auto-detect release type from commit message
            if git log -1 --pretty=%B | grep -q "BREAKING CHANGE\|major:"; then
              RELEASE_TYPE="major"
            elif git log -1 --pretty=%B | grep -q "feat:\|feature:"; then
              RELEASE_TYPE="minor" 
            else
              RELEASE_TYPE="patch"
            fi
          fi

          echo "📈 Release type: $RELEASE_TYPE"

          # Calculate new version
          NEW_VERSION=$(python3 -c "
          version = '$CURRENT_VERSION'.split('.')
          major, minor, patch = int(version[0]), int(version[1]), int(version[2])

          if '$RELEASE_TYPE' == 'major':
              major += 1
              minor = 0  
              patch = 0
          elif '$RELEASE_TYPE' == 'minor':
              minor += 1
              patch = 0
          else:
              patch += 1

          print(f'{major}.{minor}.{patch}')
          ")

          echo "🎯 New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update version in configuration
        run: |
          cd termux

          NEW_VERSION="${{ steps.version.outputs.version }}"

          # Update version in OASIS config
          python3 -c "
          import json

          with open('.oasis_termux_config.json', 'r') as f:
              config = json.load(f)

          config['orchestrator_version'] = '$NEW_VERSION'
          config['build_date'] = '$(date -u +%Y-%m-%dT%H:%M:%SZ)'
          config['build_commit'] = '${{ github.sha }}'

          with open('.oasis_termux_config.json', 'w') as f:
              json.dump(config, f, indent=2)

          print(f'✅ Updated version to $NEW_VERSION')
          "

          # Update version in setup.py
          sed -i "s/version='.*'/version='$NEW_VERSION'/" setup.py

      - name: Build distribution packages
        id: package
        run: |
          cd termux

          echo "📦 Building OASIS Termux orchestrator distribution packages..."

          # Install build tools
          python -m pip install --upgrade pip build wheel

          # Create source distribution
          python -m build --sdist

          # Create wheel distribution
          python -m build --wheel

          # Create Termux-specific installation package
          mkdir -p dist/termux-install

          # Copy essential files for Termux installation
          cp oasis_orchestrator.py dist/termux-install/
          cp requirements.txt dist/termux-install/
          cp .oasis_termux_config.json dist/termux-install/
          cp install.sh dist/termux-install/
          cp README.md dist/termux-install/

          # Create installation script
          cat > dist/termux-install/quick_install.sh << 'EOF'
          #!/bin/bash
          # OASIS v3 Termux Orchestrator Quick Installer
          # Ultra-lightweight AI orchestration for Android

          set -e

          echo "🚀 Installing OASIS v3 Termux Orchestrator..."
          echo "📱 Ultra-lightweight AI orchestration system"

          # Check Termux environment
          if [ -z "$TERMUX_VERSION" ]; then
              echo "⚠️ Warning: Not running in Termux environment"
          else
              echo "✅ Termux environment detected: $TERMUX_VERSION"
          fi

          # Install Python dependencies
          echo "📦 Installing dependencies..."
          pip install -r requirements.txt

          # Install orchestrator
          echo "🔧 Installing OASIS orchestrator..."
          python setup.py install --user

          # Create launcher script
          cat > $HOME/../usr/bin/oasis << 'LAUNCHER'
          #!/bin/bash
          cd $(dirname "$0")
          python -m oasis_orchestrator "$@"
          LAUNCHER

          chmod +x $HOME/../usr/bin/oasis

          echo "🎉 OASIS v3 Termux Orchestrator installed successfully!"
          echo "🚀 Usage: oasis --help"
          echo "📊 Size: $(du -sh . | cut -f1)"
          EOF

          chmod +x dist/termux-install/quick_install.sh

          # Create compressed archive
          cd dist
          tar -czf oasis-termux-orchestrator-${{ steps.version.outputs.version }}.tar.gz termux-install/
          zip -r oasis-termux-orchestrator-${{ steps.version.outputs.version }}.zip termux-install/

          # Calculate package sizes
          TARBALL_SIZE=$(du -sh oasis-termux-orchestrator-${{ steps.version.outputs.version }}.tar.gz | cut -f1)
          ZIP_SIZE=$(du -sh oasis-termux-orchestrator-${{ steps.version.outputs.version }}.zip | cut -f1)

          echo "📊 Package sizes:"
          echo "   📦 tar.gz: $TARBALL_SIZE"
          echo "   📦 zip: $ZIP_SIZE"

          # Validate ultra-lightweight constraint
          TARBALL_BYTES=$(stat -c%s oasis-termux-orchestrator-${{ steps.version.outputs.version }}.tar.gz)
          TARBALL_MB=$((TARBALL_BYTES / 1024 / 1024))

          if [ $TARBALL_MB -gt ${{ env.TERMUX_MAX_SIZE_MB }} ]; then
            echo "❌ Package exceeds size limit: ${TARBALL_MB}MB > ${{ env.TERMUX_MAX_SIZE_MB }}MB"
            exit 1
          else
            echo "✅ Package within size limit: ${TARBALL_MB}MB <= ${{ env.TERMUX_MAX_SIZE_MB }}MB"
          fi

          echo "size=${TARBALL_MB}MB" >> $GITHUB_OUTPUT

          cd ..
          echo "🎉 Distribution packages created successfully"

      - name: Generate installation documentation
        run: |
          cd termux

          cat > INSTALLATION.md << EOF
          # 📱 OASIS v3 Termux Orchestrator Installation Guide

          **Version**: ${{ steps.version.outputs.version }}  
          **Size**: ${{ steps.package.outputs.size }}  
          **Build**: ${{ github.sha }}

          ## 🚀 Quick Installation (Recommended)

          \`\`\`bash
          # Download and install in one command
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/quick_install.sh | bash
          \`\`\`

          ## 📦 Manual Installation

          ### Step 1: Download Package
          \`\`\`bash
          wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/oasis-termux-orchestrator-${{ steps.version.outputs.version }}.tar.gz
          tar -xzf oasis-termux-orchestrator-${{ steps.version.outputs.version }}.tar.gz
          cd termux-install
          \`\`\`

          ### Step 2: Install Dependencies  
          \`\`\`bash
          pip install -r requirements.txt
          \`\`\`

          ### Step 3: Install Orchestrator
          \`\`\`bash
          bash install.sh
          \`\`\`

          ## 🧪 Verification

          \`\`\`bash
          # Test installation
          oasis --version
          oasis --health-check

          # Test HuggingFace Spaces connectivity
          oasis --test-connectivity
          \`\`\`

          ## ⚡ Ultra-Lightweight Architecture

          - **Total Size**: < ${{ env.TERMUX_MAX_SIZE_MB }}MB (including dependencies)
          - **Memory Usage**: < 50MB runtime
          - **Dependencies**: Only Python stdlib + requests/urllib
          - **No Heavy Libraries**: No numpy, torch, pandas, etc.

          ## 🌐 HuggingFace Spaces Integration

          The orchestrator connects to HuggingFace Spaces for AI processing:

          \`\`\`bash
          # Configure HF Spaces endpoints
          oasis config --add-hf-space your-username/space-name

          # Test AI functionality
          oasis ai --prompt "Hello OASIS v3" --space text-generation
          \`\`\`

          ## 🔧 Configuration

          Edit \`.oasis_termux_config.json\`:

          \`\`\`json
          {
            "orchestrator_version": "${{ steps.version.outputs.version }}",
            "max_size_mb": ${{ env.TERMUX_MAX_SIZE_MB }},
            "hf_spaces_endpoints": [
              "your-username/space-1",
              "your-username/space-2"
            ],
            "api_timeout": 30,
            "lightweight_mode": true
          }
          \`\`\`

          ## 📱 Android Compatibility

          - **Minimum API**: ${{ env.MIN_ANDROID_API }} (Android 5.0+)
          - **Tested APIs**: ${{ env.MIN_ANDROID_API }}-${{ env.MAX_ANDROID_API }}
          - **Architecture**: ARM64, ARM32, x86_64
          - **Storage**: Internal storage + SD card access

          ## 🎯 Revenue Generation

          OASIS v3 targets **\$50K+/month** through:

          - Ultra-efficient mobile AI orchestration
          - Cloud processing via HuggingFace Spaces
          - Minimal device resource usage
          - Scalable architecture for enterprise deployment

          ## 🆘 Support

          - **Issues**: [GitHub Issues](https://github.com/${{ github.repository }}/issues)
          - **Discussions**: [GitHub Discussions](https://github.com/${{ github.repository }}/discussions) 
          - **Documentation**: [Wiki](https://github.com/${{ github.repository }}/wiki)

          ---

          **🤖 Generated by OASIS v3 CI/CD Pipeline**
          EOF

          echo "📖 Installation documentation generated"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: termux-release-${{ steps.version.outputs.version }}
          path: |
            termux/dist/*.tar.gz
            termux/dist/*.zip
            termux/dist/*.whl
            termux/INSTALLATION.md
          retention-days: 90

  # Create GitHub release
  create-release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'release' || inputs.release_type != '') &&
      needs.build-release.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v3
        with:
          name: termux-release-${{ needs.build-release.outputs.version }}
          path: ./release-artifacts

      - name: Generate release notes
        run: |
          VERSION="${{ needs.build-release.outputs.version }}"
          SIZE="${{ needs.build-release.outputs.package-size }}"

          cat > release-notes.md << EOF
