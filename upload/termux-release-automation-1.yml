          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release-artifacts/INSTALLATION.md
          asset_name: INSTALLATION.md
          asset_content_type: text/markdown

  # Notification and analytics
  notify:
    name: 📬 Release Notification
    runs-on: ubuntu-latest
    needs: [validate-constraints, test-orchestrator, android-compatibility, security-scan, build-release, create-release]
    if: always()
    steps:
      - name: Determine release status
        run: |
          if [ "${{ needs.create-release.result }}" = "success" ]; then
            STATUS="✅ RELEASED"
            COLOR="28a745"
            VERSION="${{ needs.build-release.outputs.version }}"
            SIZE="${{ needs.build-release.outputs.package-size }}"
