          - ✅ **Termux Orchestrator**: Released (this component)
          - 🚧 **HuggingFace Spaces**: Ready for deployment
          - 🚧 **Next.js Frontend**: In development  
          - 🚧 **Supabase Backend**: Schema ready

          ---

          **🤖 Auto-generated by OASIS v3 CI/CD Pipeline**  
          **📱 Ready for Android • ☁️ Cloud-Powered • ⚡ Ultra-Lightweight**
          EOF

          echo "📝 Release notes generated"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.build-release.outputs.version }}
          release_name: "OASIS v3 Termux Orchestrator v${{ needs.build-release.outputs.version }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(needs.build-release.outputs.version, 'rc') || contains(needs.build-release.outputs.version, 'beta') || contains(needs.build-release.outputs.version, 'alpha') }}

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release-artifacts/oasis-termux-orchestrator-${{ needs.build-release.outputs.version }}.tar.gz
          asset_name: oasis-termux-orchestrator-${{ needs.build-release.outputs.version }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload zip asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release-artifacts/oasis-termux-orchestrator-${{ needs.build-release.outputs.version }}.zip
          asset_name: oasis-termux-orchestrator-${{ needs.build-release.outputs.version }}.zip
          asset_content_type: application/zip

      - name: Upload installation guide
        uses: actions/upload-release-asset@v1
        env:
