name: ▲ Vercel Frontend Deployment

on:
  push:
    branches: [main, develop]
    paths: ['frontend/**', 'components/**', 'pages/**', 'next.config.js']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Deploy to production?'
        required: true
        default: false
        type: boolean

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  build_and_test:
    name: 🏗️ Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📋 Install Dependencies
        run: |
          npm ci --prefer-offline --no-audit

      - name: 🧹 Lint Code  
        run: |
          npm run lint

      - name: 🔧 Type Check
        run: |
          npm run type-check

      - name: 🏗️ Build Application
        run: |
          npm run build

      - name: 🧪 Run Tests
        run: |
          npm run test -- --watchAll=false --coverage

      - name: 📊 Bundle Analysis
        run: |
          npm run analyze

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-files
          path: |
            .next/
            out/
          retention-days: 7

  deploy_preview:
    name: 🔍 Deploy Preview
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4  
        with:
          node-version: '18'

      - name: 📋 Install Vercel CLI
        run: npm install -g vercel@latest

      - name: 🔄 Deploy Preview
        run: |
          vercel --token=${{ env.VERCEL_TOKEN }} --yes
          PREVIEW_URL=$(vercel --token=${{ env.VERCEL_TOKEN }} --confirm)
          echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_ENV

      - name: 💬 Comment Preview URL
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **OASIS v3 Preview Deployed!**

              Preview URL: ${{ env.PREVIEW_URL }}

              🌟 Features ready for testing:
              - Revenue Dashboard
              - Subscription Management  
              - Customer Portal
              - AI Processing Demo
              - Termux Integration Guide

              💰 Revenue target: $50K+/month ready for validation!`
            })

  deploy_production:
    name: 🚀 Production Deployment
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.ref == 'refs/heads/main' || github.event.inputs.deploy_to_production == 'true'
    environment: production

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📋 Install Vercel CLI
        run: npm install -g vercel@latest

      - name: 🏗️ Build for Production
        run: |
          npm ci
          npm run build

      - name: 🚀 Deploy to Production
        run: |
          vercel --token=${{ env.VERCEL_TOKEN }} --prod --yes
          PRODUCTION_URL=$(vercel --token=${{ env.VERCEL_TOKEN }} --prod --confirm)
          echo "PRODUCTION_URL=$PRODUCTION_URL" >> $GITHUB_ENV

      - name: ✅ Verify Deployment
        run: |
          echo "🔍 Verifying production deployment..."

          # Test main pages
          curl -f ${{ env.PRODUCTION_URL }} || exit 1
          curl -f ${{ env.PRODUCTION_URL }}/api/health || exit 1

          echo "✅ Production deployment verified!"

      - name: 📊 Performance Audit
        run: |
          npm install -g lighthouse

          # Run Lighthouse audit
          lighthouse ${{ env.PRODUCTION_URL }}             --only-categories=performance,accessibility,best-practices,seo             --chrome-flags="--headless --no-sandbox"             --output=json             --output-path=./lighthouse-report.json

          # Extract scores
          PERFORMANCE=$(cat lighthouse-report.json | jq '.categories.performance.score * 100')
          ACCESSIBILITY=$(cat lighthouse-report.json | jq '.categories.accessibility.score * 100')

          echo "📊 Lighthouse Scores:"
          echo "⚡ Performance: $PERFORMANCE/100"
          echo "♿ Accessibility: $ACCESSIBILITY/100"

      - name: 🎉 Success Notification
        run: |
          echo "🎉 OASIS v3 Frontend Deployed Successfully!"
          echo "🌐 Production URL: ${{ env.PRODUCTION_URL }}"
          echo "💰 Revenue Dashboard: ${{ env.PRODUCTION_URL }}/dashboard"
          echo "📱 Termux Guide: ${{ env.PRODUCTION_URL }}/termux"
          echo "🚀 Ready for $50K+/month revenue generation!"